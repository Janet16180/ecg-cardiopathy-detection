name: Repository checks

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.28"
          enable-cache: true
      - name: Install lint dependencies
        run: |
          uv python install
          uv sync --locked --only-group dev
      - name: Check Python with Ruff
        run: uv run --locked --only-group dev ruff check --output-format=github ecg_experiment scripts tests
  cpu-checks:
    name: CPU tests and package build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      DVC_NO_ANALYTICS: "true"
      MLFLOW_ENABLE_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.28"
          enable-cache: true
      - name: Install Python and locked dependencies
        run: |
          uv python install
          uv sync --locked --group data --group tracking
      - name: CPU tests
        run: uv run --locked --group data --group tracking python -m pytest -q
      - name: Build the Python package
        run: uv build --no-sources
