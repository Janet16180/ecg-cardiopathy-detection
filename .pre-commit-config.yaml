repos:
  - repo: local
    hooks:
      - id: ruff
        name: Python correctness (locked Ruff)
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: tests
        name: CPU tests
        entry: env CUDA_VISIBLE_DEVICES= OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 uv run --locked --group data --group tracking python -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
