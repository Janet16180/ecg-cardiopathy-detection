repos:
  - repo: local
    hooks:
      - id: ruff
        name: Python correctness (locked Ruff)
        entry: env UV_PROJECT_ENVIRONMENT=.venv-uv uv run --locked ruff check
        language: system
        types: [python]
      - id: tests
        name: CPU tests
        entry: make test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
