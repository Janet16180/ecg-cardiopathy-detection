[project]
name = "ecg-cardiopathy-detection"
version = "0.1.0"
description = "Raw ECG representation learning and diagnostic annotation experiments"
requires-python = ">=3.11,<3.12"
dependencies = [
    "h5py==3.16.0",
    "huggingface-hub==1.32.0",
    "matplotlib==3.11.2",
    "numpy==2.4.6",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "scipy==1.17.1",
    "timm==1.0.8",
    "torch==2.6.0+cu124",
    "torchvision==0.21.0+cu124",
    "wfdb==4.3.1",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
