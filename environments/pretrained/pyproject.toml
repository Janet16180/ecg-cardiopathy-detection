[project]
name = "ecg-pretrained-environment"
version = "0.1.0"
description = "Dependency-only environment for historical pretrained ECG encoders"
requires-python = ">=3.11,<3.12"
dependencies = [
    "biosppy==2.2.4",
    "cffi==2.1.1",
    "cython==3.3.0",
    "h5py==3.16.0",
    "huggingface-hub==0.36.2",
    "hydra-core==1.3.7",
    "iterative-stratification==0.1.9",
    "loguru==0.7.3",
    "matplotlib==3.11.2",
    "neurokit2==0.2.12",
    "numpy==2.4.6",
    "omegaconf==2.3.1",
    "opencv-python-headless==5.0.0.93",
    "pandas==3.0.6",
    "peakutils==1.3.5",
    "python-speech-features==0.6",
    "regex==2026.9.10",
    "sacrebleu==2.6.0",
    "safetensors==0.8.0",
    "scikit-learn==1.9.1",
    "scipy==1.17.1",
    "torch==2.6.0+cu124",
    "torcheval==0.0.7",
    "torchmetrics==1.9.0",
    "tqdm==4.70.1",
    "transformers==4.57.6",
    "wandb==0.30.0",
    "wfdb==4.3.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
