[project]
name = "ecg-cardiopathy-detection"
version = "0.1.0"
description = "Raw ECG representation learning and diagnostic annotation experiments"
requires-python = ">=3.11,<3.12"
dependencies = [
    "h5py==3.16.0",
    "huggingface-hub==1.32.0",
    "matplotlib==3.11.2",
    "numpy==2.4.6",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "scipy==1.17.1",
    "timm==1.0.8",
    "torch==2.6.0+cu124",
    "torchvision==0.21.0+cu124",
    "wfdb==4.3.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4,<5",
    "pytest==8.4.2",
    "ruff>=0.13,<1",
]
tracking = ["mlflow>=3,<4"]
data = ["dvc>=3,<4"]

[tool.uv]
default-groups = ["dev"]
# Preserve the installed acquisition runtime while downloaders use .venv.
constraint-dependencies = [
    "filelock==4.0.1",
    "fonttools==4.65.0",
    "setuptools==78.1.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecg_experiment"]

# Limit traversal and distribution content: raw ECGs and outputs are private.
[tool.hatch.build.targets.sdist]
only-include = [
    "ecg_experiment",
    "scripts",
    "tests",
    "pyproject.toml",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RET", "ANN", "D", "N", "S101", "PT", "C90"]
# D203/D213 conflict with the NumPy docstring layout; ANN401 allows explicit Any.
ignore = ["D203", "D212", "ANN401", "RET504", "SIM108"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN"]
"**/__init__.py" = ["D104"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
