<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ECG · Research workspace</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app">
    <aside class="lateral">
      <a class="marca" href="#overview"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M2 17h7l3-8 4 15 3-11 2 4h9"/></svg><span>ECG · Research</span></a>
      <p class="sidebar-note" data-i18n="sidebar">12-lead ECG screening research</p>
      <nav aria-label="Workspace">
        <a href="#overview" data-page="overview" data-i18n="overview">Overview</a>
        <a href="#evaluation" data-page="evaluation" data-i18n="evaluation">Threshold explorer</a>
        <a href="#prevalence" data-page="prevalence" data-i18n="prevalenceNav">Students · prevalence</a>
        <a href="#recording" data-page="recording" data-i18n="recording">New ECG</a>
        <a href="#cohorts" data-page="cohorts" data-i18n="cohorts">Training cohorts</a>
        <a href="#localization" data-page="localization" data-i18n="localization">Localization · WIP</a>
        <a href="#methods" data-page="methods" data-i18n="methods">Methods & scope</a>
      </nav>
      <div class="lateral-pie">
        <div class="language" role="group" aria-label="Language"><button id="english" aria-pressed="true">EN</button><button id="spanish" aria-pressed="false">ES</button></div>
        <button id="theme" class="secondary" data-i18n="theme">Toggle theme</button>
        <small data-i18n="local">Local research interface</small>
      </div>
    </aside>
    <main>
      <div class="topline"><span class="eyebrow" data-i18n="research">DEVELOPMENT DATA · RESEARCH ONLY</span><span id="connection" class="badge">…</span></div>
      <p id="artifact-mode" class="muted"></p>
      <div id="content" aria-live="polite"></div>
    </main>
  </div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
